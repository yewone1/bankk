<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>돈의 흐름 가계부</title>
<meta name="theme-color" content="#F1F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1514" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app — month header, tab content, fixed bottom tab bar with a raised add button */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --sunk:#E7ECEA; --ink:#15201D; --muted:#5D6A66; --line:#D9E0DD;
  --accent:#0D6B5B; --accent-ink:#FFFFFF; --accent-soft:#D9EEE8;
  --c-inc:#2F3D39; --c-fix:#4C61AE; --c-var:#D38B22; --c-save:#7457B8; --c-left:#AEB9B5; --neg:#C2453A; --pos:#0D7A64;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Space Grotesk","IBM Plex Sans KR",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#18201E; --sunk:#202A27; --ink:#E5ECE9; --muted:#93A19C; --line:#2A3532;
  --accent:#4CC3A8; --accent-ink:#06201A; --accent-soft:#163A33;
  --c-inc:#C8D3CF; --c-fix:#8C9DEB; --c-var:#EEB04E; --c-save:#A88CEB; --c-left:#56635F; --neg:#F07B6C; --pos:#5FD0B4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#18201E; --sunk:#202A27; --ink:#E5ECE9; --muted:#93A19C; --line:#2A3532;
  --accent:#4CC3A8; --accent-ink:#06201A; --accent-soft:#163A33;
  --c-inc:#C8D3CF; --c-fix:#8C9DEB; --c-var:#EEB04E; --c-save:#A88CEB; --c-left:#56635F; --neg:#F07B6C; --pos:#5FD0B4;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px}
.monthnav{display:flex;align-items:center;gap:2px;flex:1}
.monthnav h1{font-size:20px;font-weight:600;margin:0 4px;text-wrap:balance}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--sunk)}
.iconbtn svg{width:22px;height:22px}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.card h2{font-size:14px;font-weight:600;margin:0 0 12px;color:var(--muted);letter-spacing:.02em}
.card h2 .sub{font-weight:400}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden}
.summary div{background:var(--surface);padding:12px 14px;min-width:0}
.summary .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.summary .v{font-size:20px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.neg{color:var(--neg)} .pos{color:var(--pos)}

.flowsvg{width:100%;height:auto;display:block}
.flowsvg text{fill:var(--ink);font-family:var(--f-body)}
.flowsvg .amt{fill:var(--muted);font-family:var(--f-num);font-size:12px}
.flowsvg .lbl{font-size:13px;font-weight:600}
.flownote{font-size:13px;color:var(--muted);margin:10px 0 0}

.bars{display:flex;flex-direction:column;gap:10px}
.bar .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .row span:first-child{display:flex;align-items:center;gap:6px;min-width:0}
.bar .track{height:8px;background:var(--sunk);border-radius:4px;margin-top:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px}

.yt{width:100%;border-collapse:collapse;font-size:13px}
.yt th{font-weight:500;color:var(--muted);text-align:right;padding:4px 2px;font-size:12px}
.yt th:first-child,.yt td:first-child{text-align:left}
.yt td{text-align:right;padding:7px 2px;border-top:1px solid var(--line)}
.yt tr.cur td{background:var(--accent-soft)}
.yt tr[data-act]{cursor:pointer}
.yt .tot td{font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.2}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.fix.on{background:var(--c-fix);border-color:var(--c-fix);color:#fff}
.chip.var.on{background:var(--c-var);border-color:var(--c-var);color:#1d1606}
.chip.inc.on{background:var(--pos);border-color:var(--pos);color:var(--accent-ink)}
.chip.sav.on{background:var(--c-save);border-color:var(--c-save);color:var(--accent-ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--sunk);font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn.danger.armed{background:var(--neg);color:#fff}
.btn.block{width:100%;padding:14px;font-size:16px}

.day{display:flex;flex-direction:column}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:12px 2px 6px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item .badge{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;text-align:center;line-height:1.1;overflow:hidden}
.item .main{flex:1;min-width:0}
.item .t1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-size:16px;font-weight:600;white-space:nowrap}

.method .mhead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:0;text-align:left}
.method .mname{font-weight:600;font-size:16px;flex:1;min-width:0}
.method .kind{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mstats div{min-width:0}
.mstats .k{font-size:12px;color:var(--muted)}
.mstats .v{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.checkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.checkrow:first-child{border-top:0}
.checkrow .main{flex:1;min-width:0}
.tick{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick svg{width:16px;height:16px}
.mlist{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}

.acc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acc .name{font-weight:600;font-size:16px}
.acc .meta{font-size:12px;color:var(--muted)}
.acc .bal{font-size:20px;font-weight:600;margin-top:8px}
.acc .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:13px}
.acc .grid .k{color:var(--muted)}
.acc .grid .v{text-align:right}
.dday{font-family:var(--f-num);font-weight:600;font-size:13px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.dday.soon{background:var(--c-var);color:#1d1606}
.dday.done{background:var(--sunk);color:var(--muted)}
.mat{display:flex;align-items:center;gap:10px;padding:8px 0}
.mat+.mat{border-top:1px solid var(--line)}
.mat .main{flex:1;min-width:0}

.mini{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.mini span{display:inline-flex;align-items:center;gap:5px}
.mini b{color:var(--ink);font-weight:600}
.qa{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:transparent;padding:0;text-align:left;color:inherit}
.fhead h2{margin:0}
.chev svg{width:18px;height:18px;color:var(--muted);display:block}
.chev.open svg{transform:rotate(90deg)}
.fbody{margin-top:10px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:2px}
@media (prefers-reduced-motion: no-preference){.syncdot{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.25}to{opacity:1}}}
.qagroup{display:flex;flex-direction:column;gap:6px}
.qagroup+.qagroup{padding-top:10px;border-top:1px dashed var(--line)}
.qalab{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.amount.sm{padding:8px 12px}
.qarow{display:grid;grid-template-columns:auto 1fr;gap:8px}
.qarow .datebtn{width:auto}
.datebtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:15px;text-align:left;white-space:nowrap;min-width:0}
.datebtn svg{width:18px;height:18px;color:var(--muted);flex:none}
.datebtn .ph{color:var(--muted)}
.pk-back{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:40}
.pk{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:min(340px,calc(100% - 32px));background:var(--surface);border-radius:18px;padding:14px;box-shadow:0 12px 32px -12px rgba(0,0,0,.45)}
.pk-head{display:flex;align-items:center;justify-content:space-between;gap:2px}
.pk-head h4{margin:0;font-size:17px;flex:1;text-align:center}
.pk-head .iconbtn{width:36px;height:36px;font-size:18px}
.pk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px;text-align:center}
.pk-grid .dw{font-size:12px;color:var(--muted);padding:6px 0}
.pk-grid .sun{color:var(--neg)}
.pk-grid .sat{color:var(--c-fix)}
.pk-day{border:0;background:transparent;aspect-ratio:1;border-radius:50%;font-family:var(--f-num);font-size:15px;color:var(--ink);max-width:100%;padding:0}
.pk-day:hover{background:var(--sunk)}
.pk-day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.pk-grid .pk-day.sel{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.pk-foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.pk-foot .btn{flex:1}
.amount.sm input{font-size:24px}
.chip.ghost{border-style:dashed;color:var(--muted)}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0}
.frow+.frow{border-top:1px solid var(--line)}
.fmain{flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.fmain .t1{font-size:15px}
.fmain .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.stat{border:1px solid var(--line);background:transparent;border-radius:999px;font-size:13px;line-height:1.2;padding:3px 12px;color:var(--muted);white-space:nowrap;min-width:40px}
.txview{background:var(--surface);border-radius:var(--r);padding:18px 16px}
.txview .t1{font-size:16px;font-weight:500}
.txview .big{font-size:32px;font-weight:600;margin-top:4px}
.txview .big span{font-size:18px;color:var(--muted);font-weight:500}
.txview dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:15px}
.txview dt{color:var(--muted)}
.txview dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.stat.done{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.setup{max-width:420px;margin:48px auto 0;display:flex;flex-direction:column;gap:14px}
.setup h1{font-size:22px;margin:0}
.banner.err{background:var(--sunk);color:var(--neg)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}
nav.tabs button{border:0;background:transparent;padding:8px 0 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs .add{position:relative}
nav.tabs .add span.plus{width:52px;height:52px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px -6px rgba(13,107,91,.6)}
nav.tabs .add span.plus svg{width:26px;height:26px}

.backdrop{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;overflow-y:auto;overscroll-behavior:contain}
.sheet .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheethead{display:flex;align-items:center;justify-content:space-between}
.sheethead h3{margin:0;font-size:17px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 0;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-size:13px;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0}
.amount{display:flex;align-items:baseline;gap:6px;background:var(--surface);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.amount input{border:0;background:transparent;font-family:var(--f-num);font-size:30px;font-weight:600;width:100%;min-width:0;outline:none;text-align:right}
.amount span{font-size:18px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.grouplab{font-size:12px;color:var(--muted);margin:4px 0 2px}
.setlist{display:flex;flex-wrap:wrap;gap:6px}
.setlist .chip{display:inline-flex;align-items:center;gap:6px}
.setlist .chip button{border:0;background:transparent;color:var(--muted);padding:0;font-size:16px;line-height:1}
.addrow{display:flex;gap:8px}
.addrow .input{flex:1}
.hint{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top"><div class="monthnav"><h1>돈의 흐름 가계부</h1></div></header>
  <div class="empty"><b>불러오는 중</b>기록을 가져오고 있어요.</div>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="sheetRoot"></div>
<div id="pickerRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
// 지출 분류: 식비 = 혼자 먹는 것(배달·편의점·혼자 커피), 외식 = 같이 먹는 것 전부(사 주기·N빵·카페 쏘기)
const OLD_EXPENSE_CATS=[
    {n:'월세',g:'fixed'},{n:'주거',g:'fixed'},{n:'통신',g:'fixed'},{n:'보험',g:'fixed'},{n:'구독',g:'fixed'},
    {n:'식비',g:'var'},{n:'카페',g:'var'},{n:'교통비',g:'var'},{n:'생활',g:'var'},{n:'의류',g:'var'},{n:'의료',g:'var'},
    {n:'미용',g:'var'},{n:'문화여가',g:'var'},{n:'자기계발',g:'var'},{n:'선물/용돈',g:'var'},{n:'경조사',g:'var'},{n:'되팔기용',g:'var'},{n:'기타',g:'var'}];
const DEF={
  expenseCats:[
    {n:'월세',g:'fixed'},{n:'주거',g:'fixed'},{n:'통신',g:'fixed'},{n:'보험',g:'fixed'},{n:'구독',g:'fixed'},
    {n:'식비',g:'var'},{n:'외식',g:'var'},{n:'교통비',g:'var'},{n:'생활',g:'var'},{n:'의류·미용',g:'var'},{n:'문화여가',g:'var'},
    {n:'의료',g:'var'},{n:'선물·경조사',g:'var'},{n:'자기계발',g:'var'},{n:'되팔기용',g:'var'},{n:'기타',g:'var'}],
  incomeCats:['급여','부수입','상여금','정산','캐시백','이자/배당','환급금','기타'],
  methods:[{n:'체크카드',k:'check'},{n:'현금',k:'cash'},{n:'계좌이체',k:'bank'}]
};
const KIND_LABEL={credit:'신용',check:'체크',cash:'현금',bank:'이체',pay:'간편결제',local:'지역화폐'};

const CASHBACK='캐시백';

function colorOf(t){if(t.type==='income')return 'var(--pos)';if(t.type==='saving')return 'var(--c-save)';return groupOf(t.cat)==='fixed'?'var(--c-fix)':'var(--c-var)';}
function monthTx(){const p=ym(S.y,S.m);return S.txs.filter(t=>(t.date||'').startsWith(p));}
function totals(list){
  const inc=sum(list.filter(t=>t.type==='income'));
  const exp=list.filter(t=>t.type==='expense');
  const fix=sum(exp.filter(t=>groupOf(t.cat)==='fixed'));
  const vr=sum(exp)-fix;
  const sav=sum(list.filter(t=>t.type==='saving'));
  return {inc,fix,vr,exp:fix+vr,sav,left:inc-fix-vr-sav};
}

const CONF_KEY='gagyebu-conn';
let CONF=null;try{CONF=JSON.parse(localStorage.getItem(CONF_KEY)||'null');}catch(e){CONF=null;}
const API={async call(fn,...args){
  if(!CONF)throw Object.assign(new Error('NO_CONF'),{code:'NO_CONF'});
  const r=await fetch(CONF.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:CONF.key,fn,args})});
  let j;try{j=await r.json();}catch(e){throw Object.assign(new Error('NOT_JSON'),{code:'NOT_JSON'});}
  if(!j.ok)throw Object.assign(new Error(j.error),{code:j.error});
  return j.data;
}};
const COLS={tx:'txs',accounts:'accounts',fixed:'fixed'};
let chain=Promise.resolve();
function enqueue(fn){const p=chain.then(fn);chain=p.catch(()=>{});return p;}

const CACHE_KEY='gagyebu-cache';
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({tx:S.txs,accounts:S.accounts,fixed:S.fixed,cfg:S.cfg,sheetUrl:S.sheetUrl}));}catch(e){}}
let cacheTimer=null;
function saveCacheSoon(){clearTimeout(cacheTimer);cacheTimer=setTimeout(saveCache,300);}
// 아직 서버에 도착하지 않은 변경. 새로 불러온 기록 위에 다시 얹어서 화면에서 사라지지 않게 해요
const pending=new Map();
function put(col,obj){
  const k=COLS[col],arr=S[k],i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0)arr[i]=obj;else arr.push(obj);
  const pk=col+':'+obj.id,mark={col,id:obj.id,obj};pending.set(pk,mark);
  render();saveCacheSoon();
  return enqueue(()=>API.call('api_put',col,obj))
    .then(()=>{if(pending.get(pk)===mark)pending.delete(pk);})
    .catch(e=>{if(pending.get(pk)===mark)pending.delete(pk);saveErr(e);});
}
function patch(col,id,fields){const o=S[COLS[col]].find(x=>x.id===id);if(!o)return Promise.resolve();return put(col,{...o,...fields});}
function del(col,id){
  S[COLS[col]]=S[COLS[col]].filter(x=>x.id!==id);
  const pk=col+':'+id,mark={col,id,obj:null};pending.set(pk,mark);
  render();saveCacheSoon();
  return enqueue(()=>API.call('api_del',col,id))
    .then(()=>{if(pending.get(pk)===mark)pending.delete(pk);})
    .catch(e=>{if(pending.get(pk)===mark)pending.delete(pk);saveErr(e);});
}
function applyLoad(d){
  S.txs=d.tx||[];S.accounts=d.accounts||[];S.fixed=d.fixed||[];
  const c=d.cfg||{};
  S.cfg={expenseCats:c.expenseCats||DEF.expenseCats,incomeCats:c.incomeCats||DEF.incomeCats,methods:c.methods||DEF.methods};
  S.sheetUrl=d.sheetUrl||'';
  pending.forEach(p=>{const k=COLS[p.col];S[k]=S[k].filter(x=>x.id!==p.id);if(p.obj)S[k].push(p.obj);});
  saveCache();
}
// 시트에 예전 기본 분류가 손대지 않은 채 저장돼 있으면 새 기본 분류로 한 번 바꿔요 (직접 고친 목록은 그대로 둬요)
function migrateCats(){
  const key=a=>JSON.stringify((a||[]).map(c=>[c.n,c.g]));
  if(key(S.cfg.expenseCats)!==key(OLD_EXPENSE_CATS))return;
  S.cfg={...S.cfg,expenseCats:DEF.expenseCats};
  saveCache();render();
  enqueue(()=>API.call('api_setCfg',{expenseCats:S.cfg.expenseCats,incomeCats:S.cfg.incomeCats,methods:S.cfg.methods})).catch(()=>{});
}
let lastLoad=0;
async function reload(){
  S.stale=true;render();
  try{const d=await enqueue(()=>API.call('api_load'));applyLoad(d);S.status='ok';lastLoad=Date.now();}
  catch(e){if(!S.db)S.status='error';else toast('최신 기록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');}
  S.stale=false;render();
}
async function boot(){
  if(!CONF){S.status='setup';render();return;}
  let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');}catch(e){cached=null;}
  if(cached){applyLoad(cached);S.status='ok';S.db=true;S.stale=true;render();}   // 바로 보여 주기
  S.timer=setTimeout(()=>{if(S.status==='loading'){S.status='slow';render();}},10000);
  try{
    const d=await enqueue(()=>API.call('api_load'));
    applyLoad(d);S.status='ok';S.db=true;S.loaded=S.fixedLoaded=S.accLoaded=true;lastLoad=Date.now();
    migrateCats();
  }catch(e){
    if(e&&e.code==='BAD_KEY'){S.status='setup';S.setupUrl=CONF.url;S.setupErr=errMsg(e);}
    else if(cached)toast('최신 기록을 불러오지 못했어요. 저장해 둔 기록을 보여 줘요.');
    else{S.status='error';S.setupErr=errMsg(e);}
  }
  S.stale=false;clearTimeout(S.timer);
  render();autoRecord();
}

function sankey(t){
  const src=[{l:'수입',v:t.inc,c:'var(--c-inc)'}];
  if(t.left<0)src.push({l:'모자란 돈',v:-t.left,c:'var(--neg)'});
  const tg=[{l:'고정비',v:t.fix,c:'var(--c-fix)'},{l:'변동비',v:t.vr,c:'var(--c-var)'},{l:'저축·투자',v:t.sav,c:'var(--c-save)'}];
  if(t.left>0)tg.push({l:'남은 돈',v:t.left,c:'var(--c-left)'});
  const s=src.filter(x=>x.v>0),g=tg.filter(x=>x.v>0);
  if(!s.length||!g.length)return '';
  const T=Math.max(sum(s,x=>x.v),sum(g,x=>x.v));
  const gap=10,H=Math.max(190,g.length*48),W=360,xL=92,xR=258,nw=10;
  const k=(H-gap*(Math.max(s.length,g.length)-1))/T;
  const place=a=>{let y=0;a.forEach(n=>{n.h=Math.max(2,n.v*k);n.y=y;y+=n.h+gap;});};
  place(s);place(g);
  // ribbons
  let paths='';let i=0,j=0,rs=s[0].v,rt=g[0].v,os=0,ot=0;
  while(i<s.length&&j<g.length){
    const m=Math.min(rs,rt),h=m*k;
    const y0=s[i].y+os,y1=g[j].y+ot,x0=xL+nw,x1=xR,xm=(x0+x1)/2;
    if(h>0)paths+=`<path d="M${x0},${y0} C${xm},${y0} ${xm},${y1} ${x1},${y1} L${x1},${y1+h} C${xm},${y1+h} ${xm},${y0+h} ${x0},${y0+h} Z" fill="${g[j].c}" fill-opacity=".28"/>`;
    os+=h;ot+=h;rs-=m;rt-=m;
    if(rs<=1e-6){i++;os=0;rs=s[i]?s[i].v:0;}
    if(rt<=1e-6){j++;ot=0;rt=g[j]?g[j].v:0;}
  }
  const labelYs=a=>{let last=-1e9;return a.map(n=>{let y=Math.max(n.y+n.h/2,last+36);last=y;return y;});};
  const ly=labelYs(s),ry=labelYs(g);
  const VH=Math.max(H,Math.max(...ly,...ry)+22);
  const pct=v=>t.inc>0?` ${Math.round(v/t.inc*100)}%`:'';
  let nodes='';
  s.forEach((n,ix)=>{nodes+=`<rect x="${xL}" y="${n.y}" width="${nw}" height="${n.h}" rx="2" fill="${n.c}"/>
    <text x="${xL-8}" y="${ly[ix]-3}" text-anchor="end"><tspan class="lbl">${n.l}</tspan><tspan class="amt" x="${xL-8}" dy="16">${won(n.v)}</tspan></text>`;});
  g.forEach((n,ix)=>{nodes+=`<rect x="${xR}" y="${n.y}" width="${nw}" height="${n.h}" rx="2" fill="${n.c}"/>
    <text x="${xR+nw+8}" y="${ry[ix]-3}"><tspan class="lbl">${n.l}</tspan><tspan class="amt" dx="6">${pct(n.v).trim()}</tspan><tspan class="amt" x="${xR+nw+8}" dy="16">${won(n.v)}</tspan></text>`;});
  return `<svg class="flowsvg" viewBox="0 -6 ${W} ${VH+12}" role="img" aria-label="이번 달 돈의 흐름">${paths}${nodes}</svg>`;
}

function viewFlow(){
  const list=monthTx(),t=totals(list);
  let h=`<div class="summary">
    <div><div class="k"><i class="dot" style="background:var(--c-inc)"></i>수입</div><div class="v num">${won(t.inc)}</div></div>
    <div><div class="k"><i class="dot" style="background:var(--c-var)"></i>지출</div><div class="v num">${won(t.exp)}</div></div>
    <div><div class="k"><i class="dot" style="background:var(--c-save)"></i>저축·투자</div><div class="v num">${won(t.sav)}</div></div>
    <div><div class="k"><i class="dot" style="background:var(--c-left)"></i>남은 돈</div><div class="v num ${t.left<0?'neg':''}">${won(t.left)}</div></div>
  </div>`;
  if(!list.length){h+=emptyMonth();}
  else{
    const sk=sankey(t);
    let note='';
    if(t.inc>0){const r=Math.round(t.sav/t.inc*100);note=`수입의 <b>${r}%</b>를 저축·투자로 보냈어요.`;}
    if(t.left<0)note+=` 쓴 돈이 수입보다 <b class="neg">${won(-t.left)}원</b> 많아요.`;
    h+=`<section class="card"><h2>돈의 흐름</h2>${sk||'<p class="hint">수입이나 지출이 생기면 흐름이 그려져요.</p>'}${note?`<p class="flownote">${note}</p>`:''}</section>`;
    const by={};list.filter(x=>x.type==='expense').forEach(x=>{by[x.cat]=(by[x.cat]||0)+x.amount;});
    const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    if(rows.length){
      const mx=rows[0][1];
      h+=`<section class="card"><h2>어디에 썼나 <span class="sub">· 지출 ${won(t.exp)}원</span></h2><div class="bars">${rows.map(([c,v])=>{const col=groupOf(c)==='fixed'?'var(--c-fix)':'var(--c-var)';return `<div class="bar"><div class="row"><span><i class="dot" style="background:${col}"></i>${esc(c)}</span><span class="num">${won(v)}</span></div><div class="track"><div class="fill" style="width:${Math.max(2,v/mx*100)}%;background:${col}"></div></div></div>`;}).join('')}</div></section>`;
    }
  }
  // maturities
  const mats=S.accounts.filter(a=>!a.closed&&a.maturity).sort((a,b)=>a.maturity<b.maturity?-1:1);
  if(mats.length){
    h+=`<section class="card"><h2>다가오는 만기</h2>${mats.slice(0,4).map(a=>`<div class="mat"><div class="main"><div>${esc(a.name)}</div><div class="hint num">${a.maturity.replace(/-/g,'.')} · 지금 ${won(accBalance(a))}원</div></div>${ddayChip(a.maturity)}</div>`).join('')}</section>`;
  }
  // year table
  let rowsY='',tot={inc:0,exp:0,sav:0};
  for(let m=1;m<=12;m++){
    const p=ym(S.y,m),l=S.txs.filter(x=>(x.date||'').startsWith(p)),tt=totals(l);
    tot.inc+=tt.inc;tot.exp+=tt.exp;tot.sav+=tt.sav;
    const rate=tt.inc>0?Math.round(tt.sav/tt.inc*100)+'%':'–';
    rowsY+=`<tr data-act="gomonth" data-m="${m}" class="${m===S.m?'cur':''}"><td>${m}월</td><td class="num">${man(tt.inc)}</td><td class="num">${man(tt.exp)}</td><td class="num">${man(tt.sav)}</td><td class="num">${rate}</td></tr>`;
  }
  const trate=tot.inc>0?Math.round(tot.sav/tot.inc*100)+'%':'–';
  h+=`<section class="card"><h2>${S.y}년 한눈에 <span class="sub">· 단위 원</span></h2><div style="overflow-x:auto"><table class="yt"><thead><tr><th>월</th><th>수입</th><th>지출</th><th>저축</th><th>저축률</th></tr></thead><tbody>${rowsY}<tr class="tot"><td>합계</td><td class="num">${man(tot.inc)}</td><td class="num">${man(tot.exp)}</td><td class="num">${man(tot.sav)}</td><td class="num">${trate}</td></tr></tbody></table></div></section>`;
  return h;
}

function badgeText(label){

    const word=(raw.trim().split(/\s+/)[0]||clean).replace(/[^\p{L}\p{N}]/gu,'');
    return esc((word.length<=4?word:clean).slice(0,4));

}

function fixedMatch(f,list){

function fixedTx(f,y,m){

  return {date:`${ym(y,m)}-${pad(d)}`,type:'expense',cat:f.cat,memo:f.name||'',method:f.method||'',amount:Number(f.amount)||0,fixedId:f.id,createdAt:Date.now()};
}
const autoDone=new Set();
let autoBusy=false;
async function autoRecord(){
  if(autoBusy||!S.db||!S.loaded||!S.fixedLoaded||!S.accLoaded)return;
  const y=now.getFullYear(),m=now.getMonth()+1,p=ym(y,m),d=now.getDate();
  const cur=S.txs.filter(t=>(t.date||'').startsWith(p));
  const todo=[];
  S.fixed.forEach(f=>{
    const day=Math.min(Number(f.day)||0,daysIn(y,m));
    if(!day||day>d||!f.cat||!Number(f.amount))return;
    if((f.skip||[]).includes(p)||(f.since&&f.since>p))return;

  });

    toast(`고정비·자동이체 ${todo.length}건을 알아서 적었어요`);}catch(e){}
  autoBusy=false;
}

    else if(skipped){st=`<button class="stat" data-act="payFixed" data-id="${f.id}" aria-label="${name} 이번 달 건너뜀, 냈으면 누르기" title="이번 달 건너뜀">⏭️</button>`;sub=`이번 달 건너뜀 · ${method}`;}
    else{st=`<button class="stat" data-act="payFixed" data-id="${f.id}" aria-label="${name} ${esc(f.day)}일 예정, 냈으면 누르기" title="예정">⏳</button>`;sub=`매달 ${esc(f.day)}일 · ${variable?'금액 매달 다름':method}`;}
    const amt=tx?`${won(tx.amount)}`:variable?`<span class="hint" style="font-weight:500">금액 확인</span>`:won(f.amount);
    return `<div class="frow"><button class="fmain" data-act="editFixed" data-id="${f.id}"><span class="t1">${name}</span><span class="hint">${sub}</span></button><div class="fright"><span class="num" style="font-weight:600">${amt}</span>${st}</div></div>`;
  }).join('');
  const rest=[left?`남은 ${won(left)}원`:'',unknown?`금액 확인 ${unknown}개`:''].filter(Boolean).join(' + ');
  return `<section class="card"><button class="fhead" data-act="toggleFixed" aria-expanded="${S.fixedOpen}"><h2>고정비 <span class="sub">· ${items.length}개 중 ${paid}개 냄${rest?` · ${rest}`:''}</span></h2><span class="chev ${S.fixedOpen?'open':''}">${I.next}</span></button>${S.fixedOpen?`<div class="fbody">${rows}<button class="btn" style="margin-top:12px" data-act="newFixed">＋ 고정비 등록</button></div>`:''}</section>`;

function accName(id){const a=S.accounts.find(x=>x.id===id);return a?a.name:'';}

function monthsBetween(a,b){const x=parseD(a),y=parseD(b);if(!x||!y)return 0;return Math.max(0,(y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth()));}
function ddayChip(d){
  const t=parseD(d);if(!t)return '';

  const n=Math.round((t-t0)/864e5);
  if(n<0)return `<span class="dday done">만기 지남</span>`;
  if(n===0)return `<span class="dday soon">D-DAY</span>`;
  return `<span class="dday ${n<=60?'soon':''}">D-${n}</span>`;
}
function estimate(a){
  const n=monthsBetween(a.start,a.maturity),r=(Number(a.rate)||0)/100,mo=Number(a.monthly)||0,base=Number(a.base)||0;
  if(!n)return null;
  if(a.kind==='예금'){const p=base||accBalance(a);return {p,i:p*r*n/12};}
  if((a.kind==='적금'||a.kind==='청약')&&mo){const p=mo*n;return {p,i:mo*r/12*n*(n+1)/2};}
  return null;
}
function accProg(a){

    ${Object.keys(byKind).length?`<div class="chips" style="margin-top:10px">${Object.entries(byKind).map(([k,v])=>`<span class="chip">${esc(k)} <span class="num">${man(v)}</span></span>`).join('')}</div>`:''}
    <p class="hint" style="margin-top:10px">잔액 = 기존에 모은 돈 + 가계부에 적은 저축 내역</p></section>`;
  h+=`<button class="btn primary block" data-act="newAcc">＋ 통장·계좌 추가</button>`;
  if(!S.accounts.length)h+=`<div class="card empty"><b>아직 등록한 통장이 없어요</b>적금, 예금, 청약, ISA 같은 계좌를 추가하면 만기일과 잔액을 여기서 볼 수 있어요.</div>`;
  open.sort((a,b)=>(a.maturity||'9999')<(b.maturity||'9999')?-1:1).forEach(a=>h+=accCard(a));
  if(closed.length)h+=`<div class="dayhead"><span>끝난 계좌</span></div>`+closed.map(accCard).join('');
  return h;
}

function errMsg(e){
  const c=String(e&&(e.code||e.message)||'');
  if(c==='BAD_KEY')return '비밀번호가 맞지 않아요.';
  if(c==='LOCKED')return '비밀번호를 여러 번 틀려서 잠깐 잠겼어요. 1시간 뒤에 다시 해 주세요.';
  if(c==='NOT_JSON')return '서버 응답이 이상해요. Apps Script를 "액세스 권한: 모든 사용자"로 배포했는지 확인해 주세요.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(c))return '서버에 연결하지 못했어요. 주소와 인터넷 연결을 확인해 주세요.';
  return '연결하지 못했어요. ('+c+')';
}

function render(){
  const app=$('#app');
  if(S.status==='setup'){app.innerHTML=viewSetup();$('#tabs').innerHTML='';return;}
  let body='';
  if(S.tab==='flow')body=viewFlow();
  else if(S.tab==='list')body=viewLedger();
  else if(S.tab==='cards')body=viewCards();
  else body=viewAssets();
  const hideMonth=S.tab==='assets';
  const hd=hideMonth?`<header class="top"><div class="monthnav"><h1>자산</h1></div><button class="iconbtn" data-act="settings" aria-label="설정">${I.gear}</button></header>`:header();
  const st=window.scrollY;
  const ae=document.activeElement,focusId=ae&&ae.id&&app.contains(ae)?ae.id:null;
  const memos=[...new Set(S.txs.filter(x=>x.memo).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(x=>x.memo))].slice(0,40);
  app.innerHTML=hd+`<div class="stack">${statusBanner()}${body}</div><datalist id="memos">${memos.map(m=>`<option value="${esc(m)}">`).join('')}</datalist>`;

  const tb=(k,l,ic)=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-t="${k}">${ic}<span>${l}</span></button>`;
  $('#tabs').innerHTML=`<div class="in">${tb('list','내역',I.list)}${tb('flow','흐름',I.flow)}${tb('cards','카드',I.card)}${tb('assets','자산',I.bank)}</div>`;

const CAL_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function dateLabel(v,full){
  const d=parseD(v);if(!d)return '';
  const y=d.getFullYear();
  return `${full||y!==now.getFullYear()?y+'년 ':''}${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
}
function dateField(id,value,opt={}){
  return `<input type="hidden" id="${id}" value="${esc(value||'')}"><button type="button" class="datebtn" data-act="pickDate" data-target="${id}" data-full="${opt.full?1:''}" data-clear="${opt.clear?1:''}" aria-label="${esc(opt.label||'날짜')} 고르기">${CAL_ICON}<span class="${value?'':'ph'}">${value?dateLabel(value,opt.full):'날짜 선택'}</span></button>`;
}
let P=null;
function renderPicker(){
  const root=$('#pickerRoot');
  if(!P){root.innerHTML='';return;}
  const start=new Date(P.y,P.m-1,1).getDay(),n=daysIn(P.y,P.m),td=today();
  let cells=DOW.map((w,i)=>`<div class="dw ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('');
  for(let i=0;i<start;i++)cells+='<span></span>';
  for(let d=1;d<=n;d++){
    const v=`${ym(P.y,P.m)}-${pad(d)}`,dw=(start+d-1)%7;
    cells+=`<button class="pk-day ${dw===0?'sun':dw===6?'sat':''} ${v===td?'today':''} ${v===P.sel?'sel':''}" data-act="pkPick" data-v="${v}" aria-label="${dateLabel(v,true)}">${d}</button>`;

}

      <div class="bal num">${won(accBalance(a))}원</div>${accProg(a)}${accGrid(a)}

    </section>
    <div class="row2"><button class="btn primary" data-act="editAcc" data-id="${a.id}">수정</button><button class="btn" data-act="saveToAcc" data-id="${a.id}">＋ 저축 적기</button></div>
    <section class="card"><h2>저축 내역 <span class="sub">· ${hist.length}건</span></h2>
      ${hist.length?hist.slice(0,24).map(t=>`<div class="checkrow"><div class="main"><div class="num">${t.date.replace(/-/g,'.')}</div>${t.memo?`<div class="hint">${esc(t.memo)}</div>`:''}</div><span class="num" style="font-weight:600">${won(t.amount)}</span></div>`).join(''):'<p class="hint">아직 이 통장에 적은 저축이 없어요.</p>'}
    </section>`;
  }else if(F.mode==='settings'){
    const c=S.cfg;
    const setChips=(arr,kind)=>arr.map((v,i)=>`<span class="chip">${esc(v)}<button data-act="rmItem" data-kind="${kind}" data-i="${i}" aria-label="${esc(v)} 지우기">×</button></span>`).join('');
    const fx=c.expenseCats.map((x,i)=>({x,i})).filter(o=>o.x.g==='fixed'),vr=c.expenseCats.map((x,i)=>({x,i})).filter(o=>o.x.g!=='fixed');
    const ec=a=>a.map(o=>`<span class="chip">${esc(o.x.n)}<button data-act="rmItem" data-kind="exp" data-i="${o.i}" aria-label="지우기">×</button></span>`).join('');
    inner=`<div class="sheethead"><h3>설정</h3><button class="iconbtn" data-act="close" aria-label="닫기">${I.close}</button></div>
    <section class="card"><h2>결제수단</h2><div class="setlist">${c.methods.map((m,i)=>`<span class="chip">${esc(m.n)} <small class="hint">${KIND_LABEL[m.k]||''}</small><button data-act="rmItem" data-kind="method" data-i="${i}" aria-label="지우기">×</button></span>`).join('')}</div>
      <div class="addrow" style="margin-top:10px"><input class="input" id="s-method" placeholder="예: 신한 Deep Dream"><select class="input" id="s-mkind" style="flex:0 0 96px">${Object.entries(KIND_LABEL).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
      <button class="btn" style="margin-top:8px" data-act="addMethod">추가</button>
      <p class="hint" style="margin-top:8px">실제 카드 이름으로 적어 두면 카드 탭에서 명세서와 맞춰 보기 쉬워요.</p></section>
    <section class="card"><h2>지출 분류 · 고정비</h2><div class="setlist">${ec(fx)}</div><div class="addrow" style="margin-top:10px"><input class="input" id="s-fix" placeholder="새 고정비 분류"><button class="btn" data-act="addCat" data-g="fixed">추가</button></div></section>
    <section class="card"><h2>지출 분류 · 변동비</h2><div class="setlist">${ec(vr)}</div><div class="addrow" style="margin-top:10px"><input class="input" id="s-var" placeholder="새 변동비 분류"><button class="btn" data-act="addCat" data-g="var">추가</button></div></section>
    <section class="card"><h2>수입 분류</h2><div class="setlist">${setChips(c.incomeCats,'inc')}</div><div class="addrow" style="margin-top:10px"><input class="input" id="s-inc" placeholder="새 수입 분류"><button class="btn" data-act="addInc">추가</button></div></section>
    <section class="card"><h2>구글 시트</h2><p class="hint" style="margin-bottom:10px">모든 내역은 구글 시트에 저장돼요. PC에서 시트를 열면 엑셀처럼 보이고, 파일 → 다운로드 → Microsoft Excel(.xlsx)로 PC에 저장할 수 있어요. 시트에서 직접 고친 내용은 새로고침하면 앱에 반영돼요.</p><div class="row2">${S.sheetUrl?`<a class="btn" style="text-align:center;text-decoration:none;color:inherit" href="${esc(S.sheetUrl)}" target="_blank" rel="noopener">시트 열기</a>`:'<span></span>'}<button class="btn" data-act="reload">새로고침</button></div><button class="btn danger block ${F.arm==='disconnect'?'armed':''}" style="margin-top:8px" data-act="disconnect">${F.arm==='disconnect'?'한 번 더 누르면 이 기기에서 연결을 끊어요':'이 기기에서 연결 끊기'}</button><p class="hint" style="margin-top:6px">연결을 끊어도 구글 시트의 기록은 그대로예요.</p></section>`;
  }
  $('#sheetRoot').innerHTML=`<div class="backdrop" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="in"><div class="grab"></div>${inner}</div></div>`;
}
function readTxInputs(){
  if(!F||F.mode!=='tx')return;
  const a=$('#f-amount');if(a)F.amount=a.value.replace(/[^0-9]/g,'');
  const d=$('#f-date');if(d)F.date=d.value;
  const m=$('#f-memo');if(m)F.memo=m.value;
}
function readAccInputs(){
  if(!F||F.mode!=='acc')return;
  const v=id=>{const e=$('#'+id);return e?e.value:'';};
  F.name=v('a-name').trim();F.bank=v('a-bank').trim();F.rate=v('a-rate').replace(/[^0-9.]/g,'');
  F.monthly=v('a-monthly').replace(/[^0-9]/g,'');F.base=v('a-base').replace(/[^0-9]/g,'');
  F.start=v('a-start');F.maturity=v('a-mat');F.memo=v('a-memo').trim();
  F.payDay=Math.min(31,Math.max(0,Number(v('a-payday'))||0))||'';
  const c=$('#a-closed');F.closed=c?c.checked:false;
}
async function saveCfg(next){
  S.cfg=next;renderSheet();render();
  enqueue(()=>API.call('api_setCfg',{expenseCats:next.expenseCats,incomeCats:next.incomeCats,methods:next.methods})).catch(saveErr);
}

/* ---------- actions ---------- */
function readFixedInputs(){
  if(!F||F.mode!=='fixed')return;
  const v=id=>{const e=$('#'+id);return e?e.value:'';};
  F.name=v('x-name').trim();F.amount=v('x-amount').replace(/[^0-9]/g,'');
  F.day=Math.min(31,Math.max(0,Number(v('x-day'))||0))||'';
}
function readPayInputs(){
  if(!F||F.mode!=='payFixed')return;
  const a=$('#p-amount');if(a)F.amount=a.value.replace(/[^0-9]/g,'');
  const d=$('#p-date');if(d)F.date=d.value;
}
const MONEY_INPUTS=['f-amount','a-monthly','a-base','x-amount','qa-amount','p-amount'];
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(MONEY_INPUTS.includes(id)){
    const raw=e.target.value.replace(/[^0-9]/g,'');e.target.value=raw?Number(raw).toLocaleString('ko-KR'):'';
    if(id==='qa-amount')S.qa.amount=raw;
  }
  if(id==='qa-memo')S.qa.memo=e.target.value;
  if(id==='qa-date')S.qa.date=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.target.id==='qa-memo'||e.target.id==='qa-amount')){e.preventDefault();const b=document.querySelector('[data-act="qaSave"]');if(b)b.click();}
});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  const needDb=['saveTx','delTx','saveAcc','delAcc','tick','qaSave','saveFixed','delFixed','savePay','saveMethod','addMethod','addCat','addInc','rmItem','export','wipeSample','wipeAll'];
  if(needDb.includes(act)&&!S.db){toast('로그인한 상태에서만 저장할 수 있어요.');return;}
  switch(act){
    case 'tab':S.tab=el.dataset.t;render();window.scrollTo(0,0);break;
    case 'mprev':case 'mnext':{
      let m=S.m+(act==='mnext'?1:-1),y=S.y;if(m<1){m=12;y--;}if(m>12){m=1;y++;}
      S.m=m;S.y=y;S.qa.date='';render();break;}
    case 'gomonth':S.m=Number(el.dataset.m);S.qa.date='';render();break;
    case 'filter':S.filter=el.dataset.f;render();break;
    case 'toggleM':S.open[el.dataset.k]=!S.open[el.dataset.k];render();break;
    case 'new':openTx(null);break;
    case 'edit':F={mode:'txView',id:el.dataset.id,armed:false};renderSheet();break;
    case 'editTx':{const t=S.txs.find(x=>x.id===el.dataset.id);if(t)openTx(t);break;}
    case 'close':closeSheet();break;
    case 'ftype':readTxInputs();if(F.type!==el.dataset.v){F.type=el.dataset.v;F.cat='';F.accountId='';if(F.type==='saving'){const b=S.cfg.methods.find(m=>m.k==='bank');if(b)F.method=b.n;}}renderSheet();break;
    case 'fcat':readTxInputs();F.cat=el.dataset.v;renderSheet();break;
    case 'facc':readTxInputs();F.accountId=el.dataset.v;F.cat=accName(F.accountId);renderSheet();break;
    case 'fmethod':readTxInputs();F.method=F.method===el.dataset.v?'':el.dataset.v;renderSheet();break;
    case 'saveTx':{
      readTxInputs();
      const amount=Number(F.amount);
      if(!amount){toast('금액을 적어 주세요.');return;}
      if(!F.date){toast('날짜를 골라 주세요.');return;}
      if(F.type==='saving'&&!F.accountId){toast('어느 통장에 넣었는지 골라 주세요.');return;}
      if(F.type!=='saving'&&!F.cat){toast('분류를 골라 주세요.');return;}
      const doc={date:F.date,type:F.type,cat:F.type==='saving'?accName(F.accountId):F.cat,memo:F.memo.trim(),method:F.type==='income'&&F.cat!==CASHBACK?'':F.method,amount,createdAt:F.createdAt||Date.now()};
      if(F.type==='saving')doc.accountId=F.accountId;
      if(F.checked)doc.checked=true;
      if(F.fixedId&&F.type==='expense')doc.fixedId=F.fixedId;
      if(F.auto&&F.type==='saving')doc.auto=true;
      if(F.type==='expense'){lastM=F.method;rememberMethod(F.method);S.qa.method=F.method;}
      const id=F.id;closeSheet();
      put('tx',{id:id||newId(),...doc});toast(id?'고쳤어요':'적었어요');
      break;}
    case 'delTx':{
      if(!F.armed){readTxInputs();F.armed=true;renderSheet();return;}
      const id=F.id;closeSheet();
      const t=S.txs.find(x=>x.id===id);
      try{
        await del('tx',id);
        // a deleted fixed cost / auto transfer means "skip this month", so it isn't re-recorded
        if(t){
          const p=(t.date||'').slice(0,7);
          if(t.type==='expense'){const f=S.fixed.find(f=>t.fixedId===f.id||fixedMatch(f,[t]));
            if(f&&!(f.skip||[]).includes(p))await patch('fixed',f.id,{skip:[...(f.skip||[]),p]});}
          if(t.type==='saving'&&t.accountId){const a=S.accounts.find(a=>a.id===t.accountId);
            if(a&&a.payDay&&!(a.skip||[]).includes(p))await patch('accounts',a.id,{skip:[...(a.skip||[]),p]});}
        }
        toast('지웠어요');
      }catch(err){dbErr(err);}
      break;}
    case 'tick':{
      const t=S.txs.find(x=>x.id===el.dataset.id);if(!t)return;
      patch('tx',t.id,{checked:!t.checked});
      break;}
    case 'qatype':S.qa.type=el.dataset.v;S.qa.cat='';S.qa.accountId='';render();break;
    case 'qacat':S.qa.cat=S.qa.cat===el.dataset.v?'':el.dataset.v;render();break;
    case 'qaacc':S.qa.accountId=S.qa.accountId===el.dataset.v?'':el.dataset.v;render();break;
    case 'qamethod':S.qa.method=S.qa.method===el.dataset.v?'':el.dataset.v;render();break;
    case 'qamore':S.qaMore=!S.qaMore;render();break;
    case 'qaSave':{
      const q=S.qa,amount=Number(q.amount);
      if(!amount){toast('금액을 적어 주세요.');const a=$('#qa-amount');if(a)a.focus();return;}
      if(q.type==='saving'&&!q.accountId){toast('어느 통장에 넣었는지 골라 주세요.');return;}
      if(q.type!=='saving'&&!q.cat){toast('분류를 골라 주세요.');return;}
      const date=qaDate();
      const bank=(S.cfg.methods.find(x=>x.k==='bank')||{}).n||'';
      const doc={date,type:q.type,cat:q.type==='saving'?accName(q.accountId):q.cat,memo:(q.memo||'').trim(),method:q.type==='saving'?bank:q.type==='income'&&q.cat!==CASHBACK?'':(q.method||''),amount,createdAt:Date.now()};
      if(q.type==='saving')doc.accountId=q.accountId;
      if(q.type==='expense'){lastM=q.method;rememberMethod(q.method);}
      S.qa={...q,amount:'',cat:'',accountId:'',memo:''};
      put('tx',{id:newId(),...doc});
      const TY={expense:'지출',income:'수입',saving:'저축'};
      toast(`${Number(date.slice(5,7))}/${Number(date.slice(8,10))} ${TY[doc.type]} ${doc.cat} ${won(amount)}원 적었어요`);
      break;}
    case 'newFixed':F={mode:'fixed',id:null,name:'',amount:'',cat:'',method:'',day:'',armed:false};renderSheet();break;
    case 'editFixed':{const f=S.fixed.find(x=>x.id===el.dataset.id);if(f){F={mode:'fixed',...f,armed:false};renderSheet();}break;}
    case 'xcat':readFixedInputs();F.cat=el.dataset.v;if(!F.name)F.name='';renderSheet();break;
    case 'xmethod':readFixedInputs();F.method=F.method===el.dataset.v?'':el.dataset.v;renderSheet();break;
    case 'saveFixed':{
      readFixedInputs();
      if(!F.cat){toast('분류를 골라 주세요.');return;}
      if(!F.day){toast('매달 며칠에 나가는지 적어 주세요.');return;}
      const doc={name:F.name||F.cat,cat:F.cat,amount:Number(F.amount)||0,method:F.method||'',day:Number(F.day),since:F.since||ym(now.getFullYear(),now.getMonth()+1),skip:F.skip||[]};
      if(F.sample)doc.sample=true;
      const id=F.id;closeSheet();
      put('fixed',{id:id||newId(),...doc});toast('저장했어요');
      break;}
    case 'delFixed':{
      if(!F.armed){readFixedInputs();F.armed=true;renderSheet();return;}
      const id=F.id;closeSheet();
      del('fixed',id);toast('지웠어요');
      break;}
    case 'toggleFixed':
      S.fixedOpen=!S.fixedOpen;try{localStorage.setItem('fixedOpen',S.fixedOpen?'1':'0');}catch(e){}
      render();break;
    case 'payFixed':{
      const f=S.fixed.find(x=>x.id===el.dataset.id);if(!f)return;
      const isNow=S.y===now.getFullYear()&&S.m===now.getMonth()+1;
      if(Number(f.amount)){
        // 금액이 정해진 고정비는 바로 적기 (날짜는 오늘, 지난달을 보고 있으면 그달 예정일)
        const date=isNow?today():fixedTx(f,S.y,S.m).date,p=date.slice(0,7);
        put('tx',{id:`fx-${f.id}-${p}`,...fixedTx(f,S.y,S.m),date});
        if((f.skip||[]).includes(p))patch('fixed',f.id,{skip:(f.skip||[]).filter(x=>x!==p)});
        toast(`${f.name||f.cat} ${won(f.amount)}원 ${isNow?'오늘 ':''}냈어요 · 날짜가 다르면 ✓를 눌러 고치세요`);
        break;
      }
      F={mode:'payFixed',fid:f.id,amount:String(f.amount||''),method:f.method||'',date:isNow?today():fixedTx(f,S.y,S.m).date};
      renderSheet();break;}
    case 'pmethod':readPayInputs();F.method=F.method===el.dataset.v?'':el.dataset.v;renderSheet();break;
    case 'savePay':{
      readPayInputs();
      const f=S.fixed.find(x=>x.id===F.fid);if(!f){closeSheet();return;}
      const amount=Number(F.amount);
      if(!amount){toast('금액을 적어 주세요.');return;}
      if(!F.date){toast('낸 날을 골라 주세요.');return;}
      const p=F.date.slice(0,7);
      const doc={date:F.date,type:'expense',cat:f.cat,memo:f.name||'',method:F.method||'',amount,fixedId:f.id,createdAt:Date.now()};
      closeSheet();
      await put('tx',{id:`fx-${f.id}-${p}`,...doc});
      if((f.skip||[]).includes(p))await patch('fixed',f.id,{skip:(f.skip||[]).filter(x=>x!==p)});
      toast(`${f.name||f.cat} ${won(amount)}원 냈어요`);
      break;}
    case 'newAcc':openAcc(null);break;
    case 'viewAcc':F={mode:'accView',id:el.dataset.id};renderSheet();break;
    case 'editAcc':{const a=S.accounts.find(x=>x.id===el.dataset.id);if(a)openAcc(a);break;}
    case 'saveToAcc':{
      openTx(null);F.type='saving';F.accountId=el.dataset.id;F.cat=accName(F.accountId);
      const b=S.cfg.methods.find(m=>m.k==='bank');if(b)F.method=b.n;
      renderSheet();break;}
    case 'wipeSample':case 'wipeAll':{
      const all=act==='wipeAll';
      if(F.arm!==act){F.arm=act;renderSheet();return;}
      F.arm=null;F.busy=true;renderSheet();
      try{const n=await enqueue(()=>API.call('api_wipe',!all));await reload();toast(n?`${n}건을 지웠어요`:'지울 데이터가 없어요');}catch(err){saveErr(err);}
      if(F&&F.mode==='settings'){F.busy=false;renderSheet();}
      break;}
    case 'akind':readAccInputs();F.kind=el.dataset.v;renderSheet();break;
    case 'saveAcc':{
      readAccInputs();
      if(!F.name){toast('이름을 적어 주세요.');return;}
      const doc={name:F.name,kind:F.kind,bank:F.bank,monthly:Number(F.monthly)||0,rate:F.rate?Number(F.rate):0,start:F.start,maturity:F.maturity,base:Number(F.base)||0,memo:F.memo,closed:!!F.closed,payDay:Number(F.payDay)||0,skip:F.skip||[]};
      if(F.sample)doc.sample=true;
      const id=F.id;closeSheet();
      put('accounts',{id:id||newId(),...doc});toast('저장했어요');
      break;}
    case 'delAcc':{
      if(!F.armed){readAccInputs();F.armed=true;renderSheet();return;}
      const id=F.id;closeSheet();
      del('accounts',id);toast('지웠어요');
      break;}
    case 'settings':F={mode:'settings'};renderSheet();break;
    case 'pickDate':{
      const inp=document.getElementById(el.dataset.target),v=inp?inp.value:'';
      const base=parseD(v)||parseD(today());
      P={target:el.dataset.target,full:!!el.dataset.full,clear:!!el.dataset.clear,sel:v,y:base.getFullYear(),m:base.getMonth()+1};
      renderPicker();break;}
    case 'pkNav':{let m=P.m+Number(el.dataset.d),y=P.y;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}P.y=y;P.m=m;renderPicker();break;}
    case 'pkClose':P=null;renderPicker();break;
    case 'pkPick':{
      const v=el.dataset.v,inp=document.getElementById(P.target);
      if(inp){
        inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}));
        const sp=document.querySelector(`[data-act="pickDate"][data-target="${P.target}"] span`);
        if(sp){sp.textContent=v?dateLabel(v,P.full):'날짜 선택';sp.className=v?'':'ph';}
      }
      P=null;renderPicker();break;}
    case 'connect':{
      const url=(($('#c-url')||{}).value||'').trim(),key=($('#c-key')||{}).value||'';
      S.setupUrl=url;
      if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)){S.setupErr='서버 주소는 https://script.google.com/macros/s/…/exec 모양이에요. Apps Script 배포 화면의 웹 앱 URL을 그대로 복사해 주세요.';render();return;}
      if(key.length<6){S.setupErr='비밀번호는 6자 이상으로 해 주세요.';render();return;}
      const prev=CONF;CONF={url,key};S.connecting=true;S.setupErr='';render();
      try{
        const d=await API.call('api_load');
        try{localStorage.setItem(CONF_KEY,JSON.stringify(CONF));}catch(e){}
        applyLoad(d);S.status='ok';S.db=true;S.loaded=S.fixedLoaded=S.accLoaded=true;lastLoad=Date.now();
        S.connecting=false;render();autoRecord();toast('연결했어요');
      }catch(e){CONF=prev;S.connecting=false;S.setupErr=errMsg(e);render();}
      break;}
    case 'disconnect':{
      if(F.arm!=='disconnect'){F.arm='disconnect';renderSheet();return;}
      try{localStorage.removeItem(CONF_KEY);localStorage.removeItem(CACHE_KEY);}catch(e){}
      S.setupUrl=CONF&&CONF.url||'';CONF=null;closeSheet();
      S.status='setup';S.db=null;S.setupErr='';S.txs=[];S.accounts=[];S.fixed=[];render();
      break;}
    case 'newMethod':F={mode:'newMethod',name:'',kind:'credit'};renderSheet();setTimeout(()=>{const e=$('#m-name');if(e)e.focus();},50);break;
    case 'mkind':{const e=$('#m-name');if(e)F.name=e.value;F.kind=el.dataset.v;renderSheet();break;}
    case 'saveMethod':{
      const n=($('#m-name')||{}).value.trim();
      if(!n){toast('이름을 적어 주세요.');return;}
      if(S.cfg.methods.some(m=>m.n===n)){toast('이미 있어요');return;}
      const k=F.kind||'credit';
      closeSheet();
      S.qa.method=n;
      saveCfg({...S.cfg,methods:[...S.cfg.methods,{n,k}]});
      toast(`${n} 추가했어요`);
      break;}
    case 'addMethod':{
      const n=$('#s-method').value.trim(),k=$('#s-mkind').value;if(!n)return;
      if(S.cfg.methods.some(m=>m.n===n)){toast('이미 있어요');return;}
      saveCfg({...S.cfg,methods:[...S.cfg.methods,{n,k}]});break;}
    case 'addCat':{
      const g=el.dataset.g,inp=$(g==='fixed'?'#s-fix':'#s-var'),n=inp.value.trim();if(!n)return;
      if(S.cfg.expenseCats.some(c=>c.n===n)){toast('이미 있어요');return;}
      saveCfg({...S.cfg,expenseCats:[...S.cfg.expenseCats,{n,g}]});break;}
    case 'addInc':{
      const n=$('#s-inc').value.trim();if(!n)return;
      if(S.cfg.incomeCats.includes(n)){toast('이미 있어요');return;}
      saveCfg({...S.cfg,incomeCats:[...S.cfg.incomeCats,n]});break;}
    case 'rmItem':{
      const i=Number(el.dataset.i),k=el.dataset.kind,c={...S.cfg};
      if(k==='exp')c.expenseCats=c.expenseCats.filter((_,j)=>j!==i);
      else if(k==='inc')c.incomeCats=c.incomeCats.filter((_,j)=>j!==i);
      else c.methods=c.methods.filter((_,j)=>j!==i);
      saveCfg(c);break;}
    case 'reload':await reload();autoRecord();toast('구글 시트에서 다시 불러왔어요');break;
  }
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(P){P=null;renderPicker();}else if(F)closeSheet();});

render();
boot();
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
